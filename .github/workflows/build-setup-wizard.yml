name: Build setup wizard

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name CricketStreamSetup setup_wizard.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: CricketStreamSetup-windows
          path: dist/CricketStreamSetup.exe

  # PyInstaller's onefile bootloader appends a single archive (the Python runtime + bundled
  # files) after the Mach-O binary and finds it at runtime via an offset from EOF. Building
  # arm64 and x86_64 separately and lipo-merging them does NOT work for onefile builds —
  # the merged binary's bootloader can only ever discover one of the two archives (whichever
  # occurs last), so it runs fine on one architecture and fails on the other with a
  # "Failed to load Python shared library ... incompatible architecture" error (confirmed by
  # actually building and running it). The correct approach is PyInstaller's own
  # --target-arch universal2, which builds one archive containing both architectures'
  # native libraries — actions/setup-python installs python.org's own universal2 build for
  # Python >= 3.11 on macOS, so no extra Python install step is needed.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build universal2 binary
        run: pyinstaller --onefile --target-arch universal2 --name CricketStreamSetup setup_wizard.py

      - name: Verify both architectures are present
        run: lipo -info dist/CricketStreamSetup

      - name: Package with a double-clickable launcher
        # A raw Mach-O binary double-clicked in Finder runs with no visible
        # window, so an interactive wizard would appear to hang. A .command
        # file is what Finder opens in Terminal.app automatically.
        run: |
          cd dist
          cat > "Setup Wizard.command" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./CricketStreamSetup
          EOF
          chmod +x "Setup Wizard.command" CricketStreamSetup
          zip CricketStreamSetup-mac.zip CricketStreamSetup "Setup Wizard.command"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: CricketStreamSetup-mac
          path: dist/CricketStreamSetup-mac.zip

  # scorer_agent.py runs on the SCORING laptop (see TWO_LAPTOP_SETUP.md), which is often a
  # club's spare/old machine with no Python on it -- same "python is not recognised" failure
  # mode the setup wizard's own exe exists to avoid. Windows-only for now: TWO_LAPTOP_SETUP.md's
  # Mac launcher (start_scorer_agent.sh) already runs scorer_agent.py straight from source with
  # no separate install step, since Macs ship python3; Windows has no such guarantee.
  build-scorer-agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name CricketStreamScorerAgent scorer_agent.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: CricketStreamScorerAgent-windows
          path: dist/CricketStreamScorerAgent.exe

  # EXPERIMENTAL — not yet wired into `release` below, so a normal v* tag does NOT ship this.
  # Bundles server.py + quickstart.py into standalone Windows exes so the STREAMING laptop
  # never needs Python installed either (same rationale as CricketStreamScorerAgent.exe for
  # the scoring laptop). Real dependencies this time (websocket-client, anthropic, Pillow,
  # etc.), unlike the stdlib-only scorer agent -- requirements.txt has to be installed before
  # PyInstaller can bundle them. Every __file__-based path in both scripts now goes through
  # an APP_DIR/FROZEN pair (see CLAUDE.md's frozen-executable gotcha) so config.ini,
  # match_state.json, control.html etc. are found/read next to the exe, not lost in
  # PyInstaller's temp extraction folder -- verified locally, including that control.html
  # is still served LIVE off disk, not baked into the exe. quickstart launches the sibling
  # CricketStreamServer.exe as a genuine subprocess when frozen (not `python server.py`),
  # preserving the existing detached-process design that keeps the server alive through
  # quickstart's own Ctrl+C so the match report can still be generated afterward. Both exes
  # must ship together, side by side -- packaged into one zip so they can't get separated.
  # Two things this build does NOT do when frozen, both by design: auto-install missing
  # packages via pip (nothing to install -- everything needed is already bundled in) and
  # auto-start stream_telemetry.py (not bundled in this pass; degrades gracefully, same as
  # source mode without that file present).
  build-runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies + PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build server exe
        run: pyinstaller --onefile --console --name CricketStreamServer server.py

      - name: Build quickstart exe
        run: pyinstaller --onefile --console --name CricketStreamQuickstart quickstart.py

      - name: Package both together
        run: Compress-Archive -Path dist/CricketStreamServer.exe,dist/CricketStreamQuickstart.exe -DestinationPath dist/CricketStreamRuntime-windows.zip

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: CricketStreamRuntime-windows
          path: dist/CricketStreamRuntime-windows.zip

  release:
    needs: [build-windows, build-macos, build-scorer-agent-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/CricketStreamSetup-windows/CricketStreamSetup.exe
            artifacts/CricketStreamSetup-mac/CricketStreamSetup-mac.zip
            artifacts/CricketStreamScorerAgent-windows/CricketStreamScorerAgent.exe
