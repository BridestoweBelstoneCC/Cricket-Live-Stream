name: Build executables

# One download per platform, and that's the whole product:
#
#   CricketStream.exe        -> Windows (any of the club's machines)
#   CricketStream-mac.zip    -> macOS, one universal binary (Apple silicon + Intel) plus a
#                               double-clickable .command launcher
#   CricketStream-linux      -> Linux x86-64
#
# The same binary is the streaming laptop, the scorer's laptop (agent) and the bridge
# machine: the first run's setup page asks which this machine is, and config.ini
# remembers. Every page, font and the NV Play scoreboard template are built in; a file of
# the same name beside the binary overrides the built-in copy, so editing control.html
# and refreshing still works without a rebuild.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            out: CricketStream.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            out: CricketStream-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            out: CricketStream-darwin-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            out: CricketStream-darwin-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            out: CricketStream-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Version
        id: v
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="0.0.0-dev"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Windows wants a dotted four-part number in the file's version resource.
          num="$(echo "$v" | grep -oE '^[0-9]+(\.[0-9]+){0,3}' || echo 0)"
          while [[ "$(echo "$num" | tr -cd . | wc -c)" -lt 3 ]]; do num="$num.0"; done
          echo "winver=$num" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        working-directory: cmd/cricketstream
        run: >
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out rsrc
          --arch amd64,arm64 --product-version "${{ steps.v.outputs.version }}"
          --file-version "${{ steps.v.outputs.winver }}"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        # On Windows it's a GUI program: CricketStream opens its own window, with no console
        # window behind it (run from a terminal, it borrows the terminal's for subcommands).
        run: |
          gui=""
          [[ "$GOOS" != windows ]] || gui="-H windowsgui"
          go build -trimpath -ldflags "-s -w $gui -X main.version=${{ steps.v.outputs.version }}" -o "dist/${{ matrix.out }}" ./cmd/cricketstream

      - name: Check the Windows build is a GUI program
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          # The PE optional header's Subsystem: 2 = Windows GUI, 3 = console.
          python - "dist/${{ matrix.out }}" <<'PY'
          import struct, sys
          b = open(sys.argv[1], 'rb').read(4096)
          pe = struct.unpack_from('<I', b, 0x3C)[0]
          sub = struct.unpack_from('<H', b, pe + 0x5C)[0]
          print('subsystem', sub)
          sys.exit(0 if sub == 2 else 1)
          PY

      # Run the binary somewhere that is NOT the checkout, so nothing can be read from the
      # source tree: the app's page and the setup page must come up from the built-in
      # copies, and the NV Play template must be inside the binary. A broken build fails
      # here rather than on a club's match morning.
      - name: Smoke-test the binary
        # Native builds only (the Windows and macOS runners can't run every architecture).
        if: matrix.goos == 'linux' || matrix.goos == 'windows' && matrix.goarch == 'amd64' || matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        shell: bash
        env:
          CRICKETSTREAM_NO_PAUSE: '1'
          CRICKETSTREAM_NO_BROWSER: '1'
          CRICKETSTREAM_NO_WINDOW: '1' # serve the window's page, open nothing
        run: |
          set -e
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          cp "dist/${{ matrix.out }}" "$dir/"
          cd "$dir"
          ./${{ matrix.out }} help | grep -q "cricketstream setup"
          ./${{ matrix.out }} version | tee version.txt
          [[ "$GITHUB_REF_TYPE" != tag ]] || grep -qF "${{ steps.v.outputs.version }}" version.txt
          ./${{ matrix.out }} agent --check-template | tee tpl.txt
          grep -q "bundled: yes" tpl.txt
          ./${{ matrix.out }} > run.log 2>&1 &
          pid=$!
          ok=""
          # The app prints its page's address (its own port, or any free one).
          for i in $(seq 1 30); do
            base="$(grep -oE 'app page http://127\.0\.0\.1:[0-9]+' run.log | head -1 | cut -d' ' -f3 || true)"
            if [ -n "$base" ] && curl -fsS "$base/" -o app.html && curl -fsS "$base/setup?app=1" -o setup.html; then ok=1; break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          cat run.log
          [ -n "$ok" ] || { echo "the app's page never came up"; exit 1; }
          grep -q "which computer is this" app.html
          grep -q "CricketStream Setup" setup.html
          grep -q "streaming laptop" setup.html

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  # One universal macOS binary. Go builds each architecture natively, so lipo can simply
  # merge them (unlike a PyInstaller onefile build, whose appended archive broke this).
  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Merge, verify and package
        run: |
          mkdir dist
          lipo -create -output dist/CricketStream \
            artifacts/CricketStream-darwin-arm64/CricketStream-darwin-arm64 \
            artifacts/CricketStream-darwin-amd64/CricketStream-darwin-amd64
          # -info alone only prints; -verify_arch fails unless both are there.
          lipo -info dist/CricketStream
          lipo dist/CricketStream -verify_arch x86_64 arm64
          chmod +x dist/CricketStream
          dist/CricketStream help | head -3
          # A raw binary double-clicked in Finder runs with no visible window. A .command
          # file is what Finder opens in Terminal.app automatically.
          cd dist
          printf '#!/bin/bash\ncd "$(dirname "$0")"\n./CricketStream\n' > CricketStream.command
          chmod +x CricketStream.command
          zip CricketStream-mac.zip CricketStream CricketStream.command

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: CricketStream-mac
          path: dist/CricketStream-mac.zip

  release:
    needs: [build, macos-universal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/CricketStream.exe/CricketStream.exe
            artifacts/CricketStream-arm64.exe/CricketStream-arm64.exe
            artifacts/CricketStream-mac/CricketStream-mac.zip
            artifacts/CricketStream-linux/CricketStream-linux
